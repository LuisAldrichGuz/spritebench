<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spritebench</title>
<meta name="description" content="Catalogador de sprites: recorta, agrupa en conjuntos, voltea, mide en celdas y exporta a Unity y otros motores.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232c2c2c'/%3E%3Crect x='3' y='3' width='4' height='4' fill='%234b9bff'/%3E%3Crect x='9' y='3' width='4' height='4' fill='%235be37f'/%3E%3Crect x='3' y='9' width='4' height='4' fill='%23ffd24a'/%3E%3Crect x='9' y='9' width='4' height='4' fill='%23ff6b6b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="menubar"></div>
  <div id="optbar"></div>
  <div id="work">
    <div id="toolbar"></div>
    <div id="center">
      <div id="tabs"></div>
      <div id="stage">
        <canvas id="cv"></canvas>
        <div id="empty">
          <h1>Spritebench</h1>
          <p>Arrastra aquí una hoja de sprites (PNG) para empezar.</p>
          <div class="row"><button class="primary" id="emptyOpen">Abrir hoja…</button><button id="emptyDemo">Probar con una hoja de ejemplo</button></div>
          <small>Todo ocurre en tu navegador. Nada se sube a ningún servidor.</small>
        </div>
      </div>
    </div>
    <div id="dock"></div>
  </div>
  <div id="status"><span id="st-h"></span><span class="grow"></span><span id="st-l"></span><span id="st-c"></span><span id="st-s"></span><span id="st-r"></span></div>
</div>
<div id="ctx"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="drop"><div>Suelta tu hoja de sprites</div></div>
<script src="js/state.js"></script>
<script src="js/i18n.js"></script>
<script src="js/slice.js"></script>
<script src="js/actions.js"></script>
<script src="js/export.js"></script>
<script src="js/demo.js"></script>
<script src="js/ui_core.js"></script>
<script src="js/viewport.js"></script>
<script src="js/panels.js"></script>
<script src="js/review.js"></script>
<script src="js/app.js"></script>
</body>
</html>
